<!-- Tom Sawyer Reader — 中1向け英語リーダー -->
<title>Tom Sawyer Reader</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#f7f2e7;          /* 本文の紙 */
  --paper-edge:#efe8d8;     /* ヘッダー等の面 */
  --ink:#33302a;            /* 本文インク */
  --ink-soft:#6e675c;       /* 補助テキスト */
  --rule:#ddd3bf;           /* 罫線 */
  --river:#2f6e86;          /* アクセント: 河の青 */
  --river-wash:rgba(47,110,134,.16); /* 選択中の文のハイライト */
  --river-ink:#245669;      /* アクセント文字(紙上で読める濃さ) */
  --sheet:#fffdf7;          /* ボトムシート面 */
  --sheet-shadow:0 -6px 30px rgba(51,48,42,.18);
  --hint:rgba(47,110,134,.45);  /* タップ可能ヒントの点線 */
  --vocab-chip:#eee5d0;
  --focus:#8a5a2b;
  --illust-filter:none;        /* 挿絵は白地の線画。紙になじませる */
  --illust-blend:multiply;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1a1c1f; --paper-edge:#212428; --ink:#d8d2c4; --ink-soft:#928c7e;
    --rule:#33373c; --river:#6ea9bf; --river-wash:rgba(110,169,191,.20);
    --river-ink:#8fc0d2; --sheet:#25282c; --sheet-shadow:0 -6px 30px rgba(0,0,0,.5);
    --hint:rgba(110,169,191,.4); --vocab-chip:#31353a; --focus:#c8a06a;
    --illust-filter:brightness(.76) contrast(1.04) sepia(.08); --illust-blend:normal;
  }
}
:root[data-theme="dark"]{
  --paper:#1a1c1f; --paper-edge:#212428; --ink:#d8d2c4; --ink-soft:#928c7e;
  --rule:#33373c; --river:#6ea9bf; --river-wash:rgba(110,169,191,.20);
  --river-ink:#8fc0d2; --sheet:#25282c; --sheet-shadow:0 -6px 30px rgba(0,0,0,.5);
  --hint:rgba(110,169,191,.4); --vocab-chip:#31353a; --focus:#c8a06a;
    --illust-filter:brightness(.76) contrast(1.04) sepia(.08); --illust-blend:normal;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style",Charter,Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;
  overscroll-behavior-y:none;
}
.jp, .ui{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
button:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:var(--paper-edge);
  border-bottom:1px solid var(--rule);
  padding:.5rem max(1rem, env(safe-area-inset-left)) .5rem max(1rem, env(safe-area-inset-right));
}
.bar{display:flex; align-items:center; gap:.75rem; max-width:46rem; margin:0 auto}
.book-name{font-size:.95rem; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.book-name b{font-weight:600}
.bar .spacer{flex:1}
.iconbtn{
  min-width:44px; min-height:44px; display:grid; place-items:center;
  border-radius:10px; color:var(--river-ink); font-size:1.05rem;
}
.iconbtn:active{background:var(--river-wash)}
.chapters{
  display:flex; gap:.4rem; overflow-x:auto; padding:.45rem 0 .15rem; max-width:46rem; margin:0 auto;
  scrollbar-width:none;
}
.chapters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:.35rem .8rem; border-radius:999px;
  border:1px solid var(--rule); font-size:.85rem; color:var(--ink-soft); background:transparent;
}
.chip[aria-current="true"]{background:var(--river); border-color:var(--river); color:var(--paper); font-weight:600}

/* ---------- reading column ---------- */
main{
  max-width:40rem; margin:0 auto;
  padding:2.2rem max(1.4rem, env(safe-area-inset-left)) 55vh max(1.4rem, env(safe-area-inset-right));
  font-size:var(--fs, 1.16rem); line-height:1.95;
}
.ch-head{margin:2.5rem 0 2.2rem; text-align:center}
.ch-num{color:var(--river-ink); font-size:.85em; letter-spacing:.35em; text-transform:uppercase}
.ch-title{font-size:1.65em; line-height:1.3; margin:.2em 0 .1em; text-wrap:balance; font-style:italic}
.ch-title-ja{color:var(--ink-soft); font-size:.8em}
.ch-head .leaf{color:var(--river-ink); margin-top:.6rem; font-size:.9em; letter-spacing:.5em}
p.para{margin:0 0 1.1em; text-align:justify; hyphens:auto}

/* 文(タップ単位)。インライン表示のままなので本文の流れを崩さない */
.u{
  -webkit-tap-highlight-color:transparent;
  border-radius:3px;
  transition:background-color .25s;
}
body.show-hints .u{
  border-bottom:1px dotted var(--hint);
}
.u.active{
  background:var(--river-wash);
  border-bottom:1px solid var(--river);
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
}

/* 場面の区切り */
.scene-break{display:flex; justify-content:center; gap:.6em; color:var(--river-ink); margin:2em 0; font-size:.9em}

/* 挿絵プレースホルダー */
figure.illust{
  margin:1.8em 0; padding:0; text-align:center;
}
figure.illust .frame{
  border:1px dashed var(--rule); border-radius:8px; padding:1.6em 1em; color:var(--ink-soft);
  font-size:.8em; letter-spacing:.15em;
}
figure.illust img{max-width:100%; height:auto; display:block; margin:0 auto; border-radius:4px;
  filter:var(--illust-filter); mix-blend-mode:var(--illust-blend)}
figure.illust figcaption{font-style:italic; font-size:.88em; color:var(--ink-soft); margin-top:.6em; line-height:1.6}
figure.illust figcaption .cap-ja{font-style:normal; display:block; font-size:.85em; margin-top:.15em}

/* 章末ナビ */
.ch-nav{display:flex; justify-content:space-between; margin:3rem 0 0; font-size:.95rem}
.ch-nav button{color:var(--river-ink); padding:.6rem .9rem; border-radius:10px; border:1px solid var(--rule)}
.ch-nav button:active{background:var(--river-wash)}

/* ---------- bottom sheet ---------- */
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--sheet); box-shadow:var(--sheet-shadow);
  border-radius:18px 18px 0 0;
  transform:translateY(105%);
  transition:transform .28s cubic-bezier(.32,.72,.33,1);
  max-height:58vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
#sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){
  #sheet{transition:none}
  .u{transition:none}
}
.sheet-inner{max-width:46rem; margin:0 auto; width:100%; display:flex; flex-direction:column; min-height:0}
.sheet-head{display:flex; align-items:center; gap:.25rem; padding:.35rem .8rem 0}
.grabber{width:40px; height:4px; border-radius:2px; background:var(--rule); margin:.5rem auto .1rem}
.sheet-en{
  flex:0 1 auto; font-size:.98rem; line-height:1.55; color:var(--ink-soft);
  padding:.3rem 1.2rem 0; font-style:italic;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.sheet-body{overflow-y:auto; padding:.6rem 1.2rem 1.2rem; min-height:0}
.sect{margin:0 0 .95rem}
.sect:last-child{margin-bottom:.2rem}
.sect h3{
  font-size:.72rem; letter-spacing:.18em; color:var(--river-ink);
  margin:0 0 .35rem; font-weight:700;
}
.sect .ja-text{font-size:1.02rem; line-height:1.8; margin:0}
.vocab-list{display:grid; grid-template-columns:1fr; gap:.35rem 1.6rem; margin:0; padding:0; list-style:none}
@media (min-width:620px){ .vocab-list{grid-template-columns:1fr 1fr} }
.vocab-list li{display:flex; gap:.6rem; align-items:baseline; font-size:.94rem; line-height:1.5}
.vocab-list .w{
  font-family:"Iowan Old Style",Charter,Georgia,serif; font-weight:700; color:var(--river-ink);
  background:var(--vocab-chip); border-radius:6px; padding:.05rem .5rem; white-space:nowrap;
}
.sect .gr{font-size:.95rem; line-height:1.75; margin:0}
.sheet-nav{
  display:flex; align-items:center; gap:.5rem; padding:.2rem .6rem .5rem;
  border-top:1px solid var(--rule);
}
.sheet-nav .pos{flex:1; text-align:center; font-size:.78rem; color:var(--ink-soft); letter-spacing:.05em}
.navbtn{min-width:56px; min-height:44px; border-radius:10px; color:var(--river-ink); font-size:1.2rem; display:grid; place-items:center}
.navbtn:disabled{opacity:.3}
.navbtn:not(:disabled):active{background:var(--river-wash)}
#closeSheet{font-size:1rem}

/* ---------- settings popover ---------- */
#settings{
  position:fixed; top:3.4rem; right:max(.8rem, env(safe-area-inset-right)); z-index:40;
  background:var(--sheet); border:1px solid var(--rule); border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18); padding:1rem 1.1rem; width:min(310px, 92vw);
  display:none;
}
#settings.open{display:block}
#settings .row{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.45rem 0; font-size:.92rem}
#settings .seg{display:flex; border:1px solid var(--rule); border-radius:9px; overflow:hidden}
#settings .seg button{padding:.4rem .8rem; font-size:.9rem; min-height:40px}
#settings .seg button[aria-pressed="true"]{background:var(--river); color:var(--paper)}
</style>

<header class="ui">
  <div class="bar">
    <div class="book-name"><b>The Adventures of Tom Sawyer</b>&ensp;<span style="color:var(--ink-soft)">トム・ソーヤーの冒険</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnSettings" aria-label="表示設定">Aa</button>
  </div>
  <nav class="chapters" id="chapterNav" aria-label="章の選択"></nav>
</header>

<main id="reader" lang="en"></main>

<div id="settings" class="ui" role="dialog" aria-label="表示設定">
  <div class="row"><span>文字の大きさ</span>
    <div class="seg" id="segFs">
      <button data-fs="1.0rem" aria-pressed="false">小</button>
      <button data-fs="1.16rem" aria-pressed="true">中</button>
      <button data-fs="1.34rem" aria-pressed="false">大</button>
    </div>
  </div>
  <div class="row"><span>タップできる文に印</span>
    <div class="seg" id="segHint">
      <button data-hint="on" aria-pressed="false">表示</button>
      <button data-hint="off" aria-pressed="true">なし</button>
    </div>
  </div>
  <div class="row"><span>画面の色</span>
    <div class="seg" id="segTheme">
      <button data-th="" aria-pressed="true">自動</button>
      <button data-th="light" aria-pressed="false">昼</button>
      <button data-th="dark" aria-pressed="false">夜</button>
    </div>
  </div>
  <div class="row" style="color:var(--ink-soft); font-size:.8rem; padding-top:.6rem; border-top:1px solid var(--rule)">
    英文をタップすると、訳・語句・文法がひらきます。
  </div>
</div>

<div id="sheet" class="ui" role="dialog" aria-label="解説" aria-hidden="true">
  <div class="sheet-inner">
    <div class="grabber"></div>
    <div class="sheet-en" id="sheetEn" lang="en"></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-nav">
      <button class="navbtn" id="prevU" aria-label="前の文">‹</button>
      <div class="pos" id="sheetPos"></div>
      <button class="navbtn" id="nextU" aria-label="次の文">›</button>
      <button class="navbtn" id="closeSheet" aria-label="とじる">✕</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  'use strict';
  const BOOK = window.BOOK_DATA;
  const reader = document.getElementById('reader');
  const nav = document.getElementById('chapterNav');
  const sheet = document.getElementById('sheet');
  const sheetEn = document.getElementById('sheetEn');
  const sheetBody = document.getElementById('sheetBody');
  const sheetPos = document.getElementById('sheetPos');
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('tsr:'+k); return v === null ? d : v; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem('tsr:'+k, v); }catch(e){} }
  };

  // ---- flatten units for prev/next navigation ----
  let flat = [];          // [{chIdx, en, ja, vocab, grammar, el}]
  let activeIdx = -1;
  let currentCh = parseInt(store.get('ch', '0'), 10) || 0;
  if (currentCh < 0 || currentCh >= BOOK.chapters.length) currentCh = 0;

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function renderNav(){
    nav.innerHTML = '';
    BOOK.chapters.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = (i+1) + '. ' + ch.title;
      b.setAttribute('aria-current', i === currentCh ? 'true' : 'false');
      b.addEventListener('click', () => { openChapter(i); });
      nav.appendChild(b);
    });
  }

  function renderChapter(){
    const ch = BOOK.chapters[currentCh];
    flat = []; activeIdx = -1;
    closeSheet();
    reader.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'ch-head';
    head.innerHTML =
      '<div class="ch-num ui">Chapter ' + (currentCh+1) + '</div>' +
      '<h1 class="ch-title">' + esc(ch.title) + '</h1>' +
      '<div class="ch-title-ja jp">' + esc(ch.title_ja) + '</div>' +
      '<div class="leaf" aria-hidden="true">❧</div>';
    reader.appendChild(head);

    ch.items.forEach(item => {
      if (item.type === 'para'){
        const p = document.createElement('p');
        p.className = 'para';
        item.units.forEach((u, ui) => {
          if (ui > 0) p.appendChild(document.createTextNode(' '));
          const span = document.createElement('span');
          span.className = 'u';
          span.textContent = u.en;
          span.setAttribute('role', 'button');
          span.setAttribute('tabindex', '0');
          span.setAttribute('aria-label', '解説をひらく: ' + u.en);
          const idx = flat.length;
          span.addEventListener('click', () => selectUnit(idx));
          span.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectUnit(idx); }
          });
          flat.push({ en: u.en, ja: u.ja, vocab: u.vocab || [], grammar: u.grammar || '', el: span });
          p.appendChild(span);
        });
        reader.appendChild(p);
      } else if (item.type === 'caption'){
        const fig = document.createElement('figure');
        fig.className = 'illust';
        if (item.img){
          const img = document.createElement('img');
          img.src = item.img; img.alt = item.en;
          fig.appendChild(img);
        } else {
          const frame = document.createElement('div');
          frame.className = 'frame ui';
          frame.textContent = '挿絵';
          fig.appendChild(frame);
        }
        const cap = document.createElement('figcaption');
        cap.innerHTML = esc(item.en) + '<span class="cap-ja jp">' + esc(item.ja) + '</span>';
        fig.appendChild(cap);
        reader.appendChild(fig);
      } else if (item.type === 'break'){
        const d = document.createElement('div');
        d.className = 'scene-break';
        d.setAttribute('aria-hidden', 'true');
        d.textContent = '❧';
        reader.appendChild(d);
      }
    });

    const chnav = document.createElement('div');
    chnav.className = 'ch-nav ui';
    const prev = document.createElement('button');
    const next = document.createElement('button');
    if (currentCh > 0){
      prev.textContent = '‹ ' + BOOK.chapters[currentCh-1].title;
      prev.addEventListener('click', () => openChapter(currentCh-1));
    } else prev.style.visibility = 'hidden';
    if (currentCh < BOOK.chapters.length-1){
      next.textContent = BOOK.chapters[currentCh+1].title + ' ›';
      next.addEventListener('click', () => openChapter(currentCh+1));
    } else next.style.visibility = 'hidden';
    chnav.appendChild(prev); chnav.appendChild(next);
    reader.appendChild(chnav);
  }

  function openChapter(i){
    currentCh = i;
    store.set('ch', String(i));
    renderNav();
    renderChapter();
    window.scrollTo({top: 0});
  }

  // ---- sheet ----
  function selectUnit(idx){
    if (idx < 0 || idx >= flat.length) return;
    if (activeIdx === idx && sheet.classList.contains('open')){ closeSheet(); return; }
    if (activeIdx >= 0) flat[activeIdx].el.classList.remove('active');
    activeIdx = idx;
    const u = flat[idx];
    u.el.classList.add('active');

    sheetEn.textContent = u.en;
    let html = '<div class="sect"><h3>日本語訳</h3><p class="ja-text jp">' + esc(u.ja) + '</p></div>';
    if (u.vocab.length){
      html += '<div class="sect"><h3>語句</h3><ul class="vocab-list jp">' +
        u.vocab.map(v => '<li><span class="w" lang="en">' + esc(v.w) + '</span><span>' + esc(v.ja) + '</span></li>').join('') +
        '</ul></div>';
    }
    if (u.grammar){
      html += '<div class="sect"><h3>文法</h3><p class="gr jp">' + esc(u.grammar) + '</p></div>';
    }
    sheetBody.innerHTML = html;
    sheetBody.scrollTop = 0;
    sheetPos.textContent = (idx+1) + ' / ' + flat.length;
    document.getElementById('prevU').disabled = idx === 0;
    document.getElementById('nextU').disabled = idx === flat.length-1;

    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');

    // 選択した文がシートに隠れたら見える位置へ
    requestAnimationFrame(() => {
      const r = u.el.getBoundingClientRect();
      const visibleBottom = window.innerHeight - Math.min(window.innerHeight * .52, 430);
      if (r.bottom > visibleBottom || r.top < 60){
        const y = window.scrollY + r.top - Math.max(80, (visibleBottom - r.height) / 2);
        window.scrollTo({top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
      }
    });
  }

  function closeSheet(){
    if (activeIdx >= 0 && flat[activeIdx]) flat[activeIdx].el.classList.remove('active');
    activeIdx = -1;
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('closeSheet').addEventListener('click', closeSheet);
  document.getElementById('prevU').addEventListener('click', () => selectUnit(activeIdx-1));
  document.getElementById('nextU').addEventListener('click', () => selectUnit(activeIdx+1));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // ---- settings ----
  const settings = document.getElementById('settings');
  document.getElementById('btnSettings').addEventListener('click', e => {
    e.stopPropagation();
    settings.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (settings.classList.contains('open') && !settings.contains(e.target)) settings.classList.remove('open');
  });

  function seg(id, key, apply){
    const el = document.getElementById(id);
    const saved = store.get(key, null);
    el.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        const val = Object.values(b.dataset)[0];
        store.set(key, val);
        apply(val);
      });
      if (saved !== null && Object.values(b.dataset)[0] === saved){
        el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
      }
    });
    if (saved !== null) apply(saved);
  }
  seg('segFs', 'fs', v => document.querySelector('main').style.setProperty('--fs', v));
  seg('segHint', 'hint', v => document.body.classList.toggle('show-hints', v === 'on'));
  seg('segTheme', 'theme', v => {
    if (v) document.documentElement.setAttribute('data-theme', v);
    else document.documentElement.removeAttribute('data-theme');
  });

  renderNav();
  renderChapter();
})();
</script>
