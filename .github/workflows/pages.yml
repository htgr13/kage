name: Deploy reader to GitHub Pages

# tom-sawyer/ のうち、読むのに必要なファイルだけを公開する。
# (Supabase の関数やデプロイ用スクリプト、原文テキストは公開しない)

on:
  push:
    branches:
      - main
      - claude/tom-sawyer-english-material-qfzskt
    paths:
      - 'tom-sawyer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開するファイルを集める
        run: |
          set -eu
          mkdir -p _site
          cp tom-sawyer/index.html _site/
          cp tom-sawyer/data.js    _site/
          cp tom-sawyer/robots.txt _site/
          cp -R tom-sawyer/images  _site/images
          touch _site/.nojekyll
          echo "公開するファイル:"
          find _site -type f | sort | head -40
          echo "合計 $(find _site -type f | wc -l) ファイル / $(du -sh _site | cut -f1)"

      - name: 公開してはいけないものが混ざっていないか確認
        run: |
          set -eu
          for f in .htpasswd supabase deploy tools source .htaccess; do
            if [ -e "_site/$f" ]; then
              echo "公開対象に $f が入っています" >&2
              exit 1
            fi
          done
          grep -q 'name="robots"' _site/index.html \
            || { echo "index.html に noindex がありません" >&2; exit 1; }
          echo "OK"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
